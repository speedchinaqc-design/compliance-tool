name: windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: pip install pyinstaller pywebview
      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name 合规查询工具 --icon desktop/app.ico `
            --add-data "index.html;." `
            --add-data "login.html;." `
            --add-data "VERSION;." `
            --add-data "js;js" `
            --add-data "css;css" `
            --add-data "data;data" `
            --add-data "docs;docs" `
            --add-data "tools;tools" `
            desktop/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
